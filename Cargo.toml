[package]
name = "tessellio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tessellio: a screen codec that paints a surface as independently-placed tiles of cells, chained against a reference so a lost update heals."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tessellio/tessellio-core"
documentation = "https://docs.rs/tessellio-core"
readme = "README.md"
keywords = ["codec", "screen", "compression", "remote-desktop", "real-time"]
categories = ["encoding", "multimedia::images"]
publish = false

[features]
default = ["cli", "metrics", "scenes"]
# The command-line tool: the JSON form it prints and the measurements it
# takes. It is on by default because the tool is part of what this crate
# ships — `cargo install --path .` must give a person the codec's tool — and
# because a gate that does not build the tool does not gate it.
cli = ["dep:serde_json"]
# Reference scenes (test helpers).
scenes = []
# Prometheus-style metrics export.
metrics = []
# Parallel dirty-tile detection (rayon).
parallel = ["dep:rayon"]

[dependencies]
flate2 = "1"
rayon = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "tessellio-core"
path = "src/bin/tessellio-core.rs"
required-features = ["cli"]

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
# The default group, at a level a change cannot slip past. The pedantic
# group is not enabled wholesale: it asks for `#[must_use]` on hundreds of
# accessors and flags the deliberate numeric conversions the codec makes,
# which would bury a real finding.
all = { level = "warn", priority = -1 }

# The codec's arithmetic is deliberate and checked by the test suite, so the
# lints that question it are off.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
manual_clamp = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
unnecessary_cast = "allow"
useless_vec = "allow"

# The codec packs four cells per word on purpose: the slice is the point.
chunks_exact_to_as_chunks = "allow"
# The codec's loops are written as loops over an index, because the index is
# part of the algorithm's shape.
needless_range_loop = "allow"
while_let_loop = "allow"
needless_update = "allow"
if_same_then_else = "allow"

# A rectangle's four corners, named in one type.
type_complexity = "allow"

# The remaining lints are about documentation the crate does not carry.
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_arguments = "allow"
